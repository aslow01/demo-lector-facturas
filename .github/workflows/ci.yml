name: CI

on:
  push:
  pull_request:

# Permisos mínimos: el flujo solo lee el código, no escribe nada en el repositorio.
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (versiones exactas del lockfile)
        run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Umbral "high": el CI falla ante avisos de gravedad alta o crítica (hoy `npm audit` informa 0).
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
